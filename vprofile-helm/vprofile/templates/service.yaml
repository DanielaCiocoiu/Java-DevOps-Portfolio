apiVersion: v1
kind: Service
metadata:
  name: vproapp-service
spec:
  ports:
    - port: {{ .Values.app.servicePort | default 8080 }}
      protocol: TCP
      targetPort: {{ .Values.app.containerPort | default 8080 }}
  selector:
    app: {{ .Values.app.name | default "vprofile-app" }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vprodb
spec:
  ports:
    - port: {{ .Values.db.servicePort | default 3306 }}
      targetPort: 3306
      protocol: TCP
  selector:
    app: vprofile-db
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vprocache01
spec:
  ports:
    - port: {{ .Values.memcached.servicePort | default 11211 }}
      targetPort: 11211
      protocol: TCP
  selector:
    app: vprofile-memcached
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vpromq01
spec:
  ports:
    - port: {{ .Values.rabbitmq.servicePort | default 5672 }}
      targetPort: 5672
      protocol: TCP
  selector:
    app: vprofile-rabbitmq
  type: ClusterIP